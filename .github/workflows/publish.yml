name: Publish

# A version is released when package.json's version reaches main or a
# release/<major.minor> branch: this workflow publishes it to npm and pushes
# the tag v<version>. Pushing that tag by hand, or running the workflow by hand
# on a branch, also works. Tags pushed here with GITHUB_TOKEN start no further
# workflow runs.
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "release/*"
    paths:
      - package.json
      - .github/workflows/publish.yml
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Plan
        id: plan
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"
          if [ "${GITHUB_REF_TYPE}" = tag ] && [ "${GITHUB_REF_NAME}" != "${tag}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match package.json version ${tag}" >&2
            exit 1
          fi
          published=false
          if [ -n "$(npm view "${name}@${version}" version 2>/dev/null)" ]; then published=true; fi
          tagged=false
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null; then tagged=true; fi
          if [ "$published" = true ] && [ "$tagged" = true ]; then
            echo "${tag} is already published and tagged; nothing to do"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "published=${published}" >> "$GITHUB_OUTPUT"
          echo "tagged=${tagged}" >> "$GITHUB_OUTPUT"
      - if: steps.plan.outputs.published == 'false'
        run: npm install -g npm@latest
      - if: steps.plan.outputs.published == 'false'
        run: npm ci --include=dev
      - if: steps.plan.outputs.published == 'false'
        run: npm run build
      - if: steps.plan.outputs.published == 'false'
        run: npm run typecheck
      - if: steps.plan.outputs.published == 'false'
        run: npm test
      - if: steps.plan.outputs.published == 'false'
        run: npm run verify:notes
      - if: steps.plan.outputs.published == 'false'
        run: npm run verify:docs
      - name: Choose dist-tag
        id: dist
        if: steps.plan.outputs.published == 'false'
        run: |
          git fetch origin '+refs/heads/*:refs/remotes/origin/*'
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            tag=latest
          else
            tag=""
            for ref in $(git branch -r --contains "$GITHUB_SHA" --format='%(refname:short)'); do
              case "$ref" in
                origin/release/[0-9]*.[0-9]*) tag="dsh-${ref#origin/release/}"; break ;;
              esac
            done
          fi
          if [ -z "$tag" ]; then
            echo "commit is on neither origin/main nor a release/<major.minor> branch" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - if: steps.plan.outputs.published == 'false'
        run: npm publish --provenance --access public --tag "${{ steps.dist.outputs.tag }}"
      - name: Push the version tag
        if: steps.plan.outputs.tagged == 'false'
        run: |
          git tag "${{ steps.plan.outputs.tag }}" "$GITHUB_SHA"
          git push origin "refs/tags/${{ steps.plan.outputs.tag }}"
