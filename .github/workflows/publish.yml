name: Publish

# A version is released when package.json's version reaches main or a
# rel/<major.minor> branch: this workflow publishes it to npm and pushes
# the tag v<version>. Pushing that tag by hand, or running the workflow by hand
# on a branch, also works. Tags pushed here with GITHUB_TOKEN start no further
# workflow runs.
on:
  workflow_dispatch:
    inputs:
      remove_dist_tag:
        description: "Remove this dist-tag from the package (repairs a stray tag), then run the normal plan"
        required: false
        type: string
  push:
    branches:
      - main
      - "rel/*"
    paths:
      - package.json
      - .github/workflows/publish.yml
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Plan
        id: plan
        env:
          REMOVE_DIST_TAG: ${{ inputs.remove_dist_tag }}
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"
          # A rel/* branch publishes only when it is a line branch
          # (rel/0.1, rel/0.2): a version-bump PR branch such as
          # rel/0.2.12 must wait for its merge into main, or its push
          # would publish the version under a line dist-tag derived from
          # the branch name.
          if [ "${GITHUB_REF_TYPE}" = branch ] && [[ "${GITHUB_REF_NAME}" =~ ^rel/ ]] && ! [[ "${GITHUB_REF_NAME}" =~ ^rel/[0-9]+\.[0-9]+$ ]]; then
            echo "${GITHUB_REF_NAME} is a release PR branch, not a rel/<major.minor> line; publish happens when it merges into main" >&2
            exit 0
          fi
          if [ "${GITHUB_REF_TYPE}" = tag ] && [ "${GITHUB_REF_NAME}" != "${tag}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match package.json version ${tag}" >&2
            exit 1
          fi
          published=false
          if [ -n "$(npm view "${name}@${version}" version 2>/dev/null)" ]; then published=true; fi
          tagged=false
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null; then tagged=true; fi
          if [ "$published" = true ] && [ "$tagged" = true ]; then
            echo "${tag} is already published and tagged; nothing to do"
          fi
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "published=${published}" >> "$GITHUB_OUTPUT"
          echo "tagged=${tagged}" >> "$GITHUB_OUTPUT"
      - name: Remove a stray dist-tag
        if: inputs.remove_dist_tag != ''
        run: |
          npm install -g npm@latest
          npm dist-tag rm "${{ steps.plan.outputs.name }}" "${{ inputs.remove_dist_tag }}"
      - if: steps.plan.outputs.published == 'false'
        run: npm install -g npm@latest
      - if: steps.plan.outputs.published == 'false'
        run: npm ci --include=dev
      - if: steps.plan.outputs.published == 'false'
        run: npm run build
      - if: steps.plan.outputs.published == 'false'
        run: npm run typecheck
      - if: steps.plan.outputs.published == 'false'
        run: npm test
      - if: steps.plan.outputs.published == 'false'
        run: npm run verify:notes
      - if: steps.plan.outputs.published == 'false'
        run: npm run verify:docs
      - name: Choose dist-tag
        id: dist
        if: steps.plan.outputs.published == 'false'
        run: |
          git fetch origin '+refs/heads/*:refs/remotes/origin/*'
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            tag=latest
          else
            tag=""
            for ref in $(git branch -r --contains "$GITHUB_SHA" --format='%(refname:short)'); do
              if [[ "$ref" =~ ^origin/rel/[0-9]+\.[0-9]+$ ]]; then tag="dsh-${ref#origin/rel/}"; break; fi
            done
          fi
          if [ -z "$tag" ]; then
            echo "commit is on neither origin/main nor a rel/<major.minor> branch" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - if: steps.plan.outputs.published == 'false'
        run: npm publish --provenance --access public --tag "${{ steps.dist.outputs.tag }}"
      - name: Reconcile the dist-tag of an already published version
        # A publish that succeeded under the wrong dist-tag (or was staged
        # while a second run failed with E409) cannot be republished; point
        # the expected dist-tag at the version instead. Dist-tag operations
        # over OIDC need a recent npm (11.21+), so upgrade first.
        if: steps.plan.outputs.published == 'true' && github.ref_type == 'branch'
        run: |
          npm install -g npm@latest
          git fetch origin '+refs/heads/*:refs/remotes/origin/*'
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            tag=latest
          else
            tag=""
            for ref in $(git branch -r --contains "$GITHUB_SHA" --format='%(refname:short)'); do
              if [[ "$ref" =~ ^origin/rel/[0-9]+\.[0-9]+$ ]]; then tag="dsh-${ref#origin/rel/}"; break; fi
            done
          fi
          if [ -z "$tag" ]; then
            echo "commit is on neither origin/main nor a rel/<major.minor> branch; no dist-tag to reconcile" >&2
            exit 0
          fi
          npm dist-tag add "${{ steps.plan.outputs.name }}@$(node -p "require('./package.json').version")" "$tag"
      - name: Push the version tag
        if: steps.plan.outputs.tagged == 'false'
        run: |
          git tag "${{ steps.plan.outputs.tag }}" "$GITHUB_SHA"
          git push origin "refs/tags/${{ steps.plan.outputs.tag }}"
