name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm install -g npm@latest
      - run: npm ci --include=dev
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - run: npm run verify:notes
      - run: npm run verify:docs
      - name: Check tag matches package version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match package.json version v${version}" >&2
            exit 1
          fi
      - name: Choose dist-tag
        id: dist
        run: |
          git fetch origin '+refs/heads/*:refs/remotes/origin/*'
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            tag=latest
          else
            tag=""
            for ref in $(git branch -r --contains "$GITHUB_SHA" --format='%(refname:short)'); do
              case "$ref" in
                origin/release/[0-9]*.[0-9]*) tag="dsh-${ref#origin/release/}"; break ;;
              esac
            done
          fi
          if [ -z "$tag" ]; then
            echo "tag commit is on neither origin/main nor a release/<major.minor> branch" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - run: npm publish --provenance --access public --tag "${{ steps.dist.outputs.tag }}"
