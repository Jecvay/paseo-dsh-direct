<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">在审批前显示完整计划</title>
  <desc id="desc">DSH 已提供 Markdown 计划，但插件把计划工具变成原始 JSON，并漏传审批正文。候选修复使用 Paseo 原生计划卡；批准执行计划，继续规划保留计划模式，中断则取消。单元回归已通过，浏览器和手机展示尚待验证，候选尚未发布。</desc>
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#42566d"/></marker></defs>
  <rect width="1600" height="1000" fill="#f5f7fb"/>
  <g font-family="WenQuanYi Zen Hei, Noto Sans CJK SC, sans-serif" fill="#142c45">
    <text x="80" y="82" font-size="44" font-weight="bold">在审批前显示完整计划</text>
    <text x="80" y="128" font-size="26">修复候选 0.2.20 · 尚未发布 · 使用 Paseo 原生组件</text>
    <text x="80" y="195" font-size="30" font-weight="bold">问题：选项出现了，正文却丢在映射途中</text>
    <g fill="#ffffff" stroke="#7d8ea3" stroke-width="2">
      <rect x="80" y="226" width="390" height="145" rx="16"/>
      <rect x="605" y="226" width="390" height="145" rx="16" fill="#fff0e8" stroke="#ac542d"/>
      <rect x="1130" y="226" width="390" height="145" rx="16"/>
    </g>
    <g font-size="29" text-anchor="middle">
      <text x="275" y="275" font-weight="bold">DSH 已提供完整计划</text><text x="275" y="320">Markdown + 审核选项</text>
      <text x="800" y="275" font-weight="bold">插件未识别计划类型</text><text x="800" y="320">工具变成 JSON · 审批漏正文</text>
      <text x="1325" y="275" font-weight="bold">用户看不到计划</text><text x="1325" y="320">只有折叠工具和批准按钮</text>
    </g>
    <g stroke="#42566d" stroke-width="4" marker-end="url(#arrow)"><path d="M480 298 H590"/><path d="M1005 298 H1115"/></g>
    <text x="80" y="440" font-size="30" font-weight="bold">修复：将正文和决定交给原生计划卡</text>
    <g fill="#ffffff" stroke="#7d8ea3" stroke-width="2">
      <rect x="80" y="470" width="390" height="150" rx="16"/>
      <rect x="605" y="470" width="390" height="150" rx="16" fill="#e7f5ee" stroke="#287456" stroke-width="3"/>
      <rect x="1130" y="470" width="390" height="150" rx="16"/>
    </g>
    <g font-size="29" text-anchor="middle">
      <text x="275" y="520" font-weight="bold">保留 DSH 原始正文</text><text x="275" y="565">工具参数 + 本次审核请求</text>
      <text x="800" y="520" font-weight="bold">补齐两处计划映射</text><text x="800" y="565">计划工具卡 + 计划审批卡</text>
      <text x="1325" y="520" font-weight="bold">先读 Markdown 再决定</text><text x="1325" y="565">实时对话与历史都保留正文</text>
    </g>
    <g stroke="#42566d" stroke-width="4" marker-end="url(#arrow)"><path d="M480 545 H590"/><path d="M1005 545 H1115"/></g>
    <g fill="#ffffff" stroke="#7d8ea3" stroke-width="2">
      <rect x="80" y="695" width="440" height="130" rx="16"/>
      <rect x="580" y="695" width="440" height="130" rx="16"/>
      <rect x="1080" y="695" width="440" height="130" rx="16"/>
    </g>
    <g font-size="29" text-anchor="middle">
      <text x="300" y="744" font-weight="bold">Approve → 原批准选项</text><text x="300" y="788">DSH 退出计划模式并执行</text>
      <text x="800" y="744" font-weight="bold">Keep planning → 原继续选项</text><text x="800" y="788">继续规划，不把问答取消</text>
      <text x="1300" y="744" font-weight="bold">中断 → 取消本次审核</text><text x="1300" y="788">保持取消与继续规划的区别</text>
    </g>
    <rect x="80" y="870" width="1440" height="88" rx="14" fill="#e8edf5"/>
    <text x="110" y="906" font-size="26">已验证：真实 Paseo / DSH 中批准、继续规划、中断与恢复对话；单元测试通过。</text>
    <text x="110" y="941" font-size="26">尚未验证浏览器与手机显示。目标版本 0.2.20 尚未发布，发布后会在工单补充更新方式。</text>
  </g>
</svg>
