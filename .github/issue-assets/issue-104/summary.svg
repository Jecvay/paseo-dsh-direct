<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Removing the install-time build from the Paseo plugin package</title>
  <desc id="desc">Before, the npm package had no lockfile but Paseo ran npm install at install time, which the official registry's packaging rules treat as a blocker. After, the 0.2.26 candidate ships the generated bridge and version modules, and Paseo compiles them directly. Local and Git installs are verified; the npm 0.2.26 install and official review are not yet done.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b91c1c"/>
    </marker>
    <style>
      .title { font: 700 42px/1.2 system-ui, -apple-system, "Segoe UI", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 23px/1.3 system-ui, -apple-system, "Segoe UI", sans-serif; fill: #475569; }
      .lane { font: 700 25px/1.2 system-ui, -apple-system, "Segoe UI", sans-serif; fill: #334155; letter-spacing: .03em; }
      .status { font: 700 19px/1.2 system-ui, -apple-system, "Segoe UI", sans-serif; letter-spacing: .08em; }
      .box-title { font: 700 30px/1.2 system-ui, -apple-system, "Segoe UI", sans-serif; fill: #0f172a; }
      .box-text { font: 400 24px/1.35 system-ui, -apple-system, "Segoe UI", sans-serif; fill: #334155; }
      .small { font: 400 20px/1.35 system-ui, -apple-system, "Segoe UI", sans-serif; fill: #475569; }
      .bad { font: 700 24px/1.3 system-ui, -apple-system, "Segoe UI", sans-serif; fill: #991b1b; }
      .ok { font: 700 24px/1.3 system-ui, -apple-system, "Segoe UI", sans-serif; fill: #166534; }
      .warn { font: 700 24px/1.3 system-ui, -apple-system, "Segoe UI", sans-serif; fill: #92400e; }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="#f8fafc"/>
  <text class="title" x="80" y="76">Official Paseo registry: remove the install-time build</text>
  <text class="subtitle" x="80" y="114">Ship the generated bridge and version modules, so Paseo compiles the package directly.</text>

  <!-- BEFORE -->
  <text class="lane" x="80" y="166">BEFORE - build at install (0.2.25)</text>
  <rect x="80" y="185" width="420" height="200" rx="12" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
  <text class="box-title" x="108" y="228">npm 0.2.25</text>
  <text class="box-text" x="108" y="268">No lockfile is published.</text>
  <text class="box-text" x="108" y="302">Install runs npm install.</text>
  <text class="box-text" x="108" y="336">385 packages resolved.</text>

  <line x1="500" y1="285" x2="580" y2="285" stroke="#b91c1c" stroke-width="3" marker-end="url(#arrowRed)"/>

  <rect x="590" y="185" width="420" height="200" rx="12" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
  <text class="box-title" x="618" y="228">Every install</text>
  <text class="box-text" x="618" y="268">No pinned versions.</text>
  <text class="box-text" x="618" y="302">Build runs on the</text>
  <text class="box-text" x="618" y="336">user's machine.</text>

  <line x1="1010" y1="285" x2="1090" y2="285" stroke="#b91c1c" stroke-width="3" marker-end="url(#arrowRed)"/>

  <rect x="1100" y="185" width="420" height="200" rx="12" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
  <text class="box-title" x="1128" y="228">Registry review</text>
  <text class="bad" x="1128" y="268">Packaging blocker.</text>
  <text class="box-text" x="1128" y="304">Install inputs not fixed.</text>
  <text class="box-text" x="1128" y="338">Package cannot pass review.</text>

  <!-- AFTER -->
  <text class="lane" x="80" y="456">AFTER - build at release (0.2.26 candidate)</text>
  <rect x="80" y="475" width="420" height="200" rx="12" fill="#eff6ff" stroke="#1d4ed8" stroke-width="3"/>
  <text class="status" x="108" y="506" fill="#1d4ed8">CHANGED</text>
  <text class="box-title" x="108" y="542">Release build</text>
  <text class="box-text" x="108" y="582">Generate bridge + version.</text>
  <text class="box-text" x="108" y="616">Commit them before release.</text>

  <line x1="500" y1="575" x2="580" y2="575" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="590" y="475" width="420" height="200" rx="12" fill="#eff6ff" stroke="#1d4ed8" stroke-width="3"/>
  <text class="status" x="618" y="506" fill="#1d4ed8">CHANGED</text>
  <text class="box-title" x="618" y="542">npm 0.2.26</text>
  <text class="box-text" x="618" y="582">Generated modules shipped.</text>
  <text class="box-text" x="618" y="616">No build, no postinstall.</text>

  <line x1="1010" y1="575" x2="1090" y2="575" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="1100" y="475" width="420" height="200" rx="12" fill="#eff6ff" stroke="#1d4ed8" stroke-width="3"/>
  <text class="status" x="1128" y="506" fill="#1d4ed8">CHANGED</text>
  <text class="box-title" x="1128" y="542">Paseo compiles</text>
  <text class="box-text" x="1128" y="582">Git and local: no build.</text>
  <text class="box-text" x="1128" y="616">npm install: pending.</text>

  <!-- next step -->
  <line x1="800" y1="675" x2="800" y2="720" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="590" y="720" width="420" height="104" rx="12" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <text class="box-title" x="618" y="760">Submit to registry</text>
  <text class="box-text" x="618" y="794">after 0.2.26 is published</text>

  <!-- verified -->
  <rect x="80" y="720" width="420" height="210" rx="12" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
  <text class="status" x="108" y="752" fill="#166534">VERIFIED</text>
  <text class="box-title" x="108" y="786">Git and local copies</text>
  <text class="box-text" x="108" y="824">Both start with no build on</text>
  <text class="box-text" x="108" y="858">Paseo 0.17.5; provider ready.</text>
  <text class="small" x="108" y="894">Package check and typechecks pass.</text>
  <text class="small" x="108" y="920">356 tests pass; 3 skipped.</text>

  <!-- not yet -->
  <rect x="1100" y="720" width="420" height="210" rx="12" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
  <text class="status" x="1128" y="752" fill="#92400e">NOT YET VERIFIED</text>
  <text class="box-title" x="1128" y="786">npm 0.2.26</text>
  <text class="box-text" x="1128" y="824">Not published. npm install</text>
  <text class="box-text" x="1128" y="858">and registry review are open.</text>
  <text class="box-text" x="1128" y="892">Users stay on 0.2.25.</text>

  <text class="small" x="80" y="970">Blue: changed. Green: verified. Amber: not yet verified. White: next step.</text>
</svg>
