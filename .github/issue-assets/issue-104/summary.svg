<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Removing the install-time build from the Paseo plugin package</title>
  <desc id="desc">Before, the npm package had no lockfile but Paseo ran npm install at install time, so the official registry blocked it. After, the release ships the generated bridge and version modules, Paseo compiles them directly, and the tested version can be submitted to the official registry.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b91c1c"/>
    </marker>
    <style>
      .title { font: 700 42px/1.2 system-ui, -apple-system, "Segoe UI", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 22px/1.3 system-ui, -apple-system, "Segoe UI", sans-serif; fill: #475569; }
      .lane { font: 700 24px/1.2 system-ui, -apple-system, "Segoe UI", sans-serif; fill: #334155; letter-spacing: .04em; }
      .box-title { font: 700 27px/1.2 system-ui, -apple-system, "Segoe UI", sans-serif; fill: #0f172a; }
      .box-text { font: 400 21px/1.35 system-ui, -apple-system, "Segoe UI", sans-serif; fill: #334155; }
      .small { font: 400 18px/1.35 system-ui, -apple-system, "Segoe UI", sans-serif; fill: #475569; }
      .ok { font: 700 22px/1.3 system-ui, -apple-system, "Segoe UI", sans-serif; fill: #166534; }
      .warn { font: 700 22px/1.3 system-ui, -apple-system, "Segoe UI", sans-serif; fill: #92400e; }
      .bad { font: 700 22px/1.3 system-ui, -apple-system, "Segoe UI", sans-serif; fill: #991b1b; }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="#f8fafc"/>
  <text class="title" x="80" y="78">Official Paseo registry: remove the install-time build</text>
  <text class="subtitle" x="80" y="116">Ship the generated bridge and version modules, so Paseo compiles the package directly.</text>

  <!-- BEFORE -->
  <text class="lane" x="80" y="180">BEFORE</text>
  <rect x="80" y="200" width="430" height="180" rx="12" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
  <text class="box-title" x="108" y="246">npm tarball 0.2.25</text>
  <text class="box-text" x="108" y="284">No lockfile is published.</text>
  <text class="box-text" x="108" y="316">Build step: npm install</text>
  <text class="box-text" x="108" y="348">--include=dev, resolved fresh.</text>

  <line x1="510" y1="290" x2="590" y2="290" stroke="#b91c1c" stroke-width="3" marker-end="url(#arrowRed)"/>

  <rect x="600" y="200" width="430" height="180" rx="12" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
  <text class="box-title" x="628" y="246">385 packages at install</text>
  <text class="box-text" x="628" y="284">Unlocked dependency tree.</text>
  <text class="box-text" x="628" y="316">Leaked into every user install.</text>
  <text class="box-text" x="628" y="348">npm 12 cannot run npm ci here.</text>

  <line x1="1030" y1="290" x2="1110" y2="290" stroke="#b91c1c" stroke-width="3" marker-end="url(#arrowRed)"/>

  <rect x="1120" y="200" width="400" height="180" rx="12" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
  <text class="box-title" x="1148" y="246">Registry review</text>
  <text class="bad" x="1148" y="286">Packaging blocker.</text>
  <text class="box-text" x="1148" y="322">No fixed install inputs, so the</text>
  <text class="box-text" x="1148" y="352">artifact cannot be approved.</text>

  <!-- AFTER -->
  <text class="lane" x="80" y="470">AFTER</text>
  <rect x="80" y="490" width="430" height="190" rx="12" fill="#eff6ff" stroke="#1d4ed8" stroke-width="3"/>
  <text class="box-title" x="108" y="536">Release build</text>
  <text class="box-text" x="108" y="574">npm run build regenerates</text>
  <text class="box-text" x="108" y="606">generated-bridge.ts and</text>
  <text class="box-text" x="108" y="638">generated-version.ts; commit them.</text>

  <line x1="510" y1="585" x2="590" y2="585" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="600" y="490" width="430" height="190" rx="12" fill="#eff6ff" stroke="#1d4ed8" stroke-width="3"/>
  <text class="box-title" x="628" y="536">npm tarball 0.2.26</text>
  <text class="box-text" x="628" y="574">TypeScript plus generated</text>
  <text class="box-text" x="628" y="606">bridge and version modules.</text>
  <text class="box-text" x="628" y="638">No build, no postinstall.</text>

  <line x1="1030" y1="585" x2="1110" y2="585" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="1120" y="490" width="400" height="190" rx="12" fill="#f0fdf4" stroke="#15803d" stroke-width="3"/>
  <text class="box-title" x="1148" y="536">Paseo compiles directly</text>
  <text class="box-text" x="1148" y="574">npm, Git and local directories</text>
  <text class="box-text" x="1148" y="606">start the same provider; no</text>
  <text class="box-text" x="1148" y="638">plugin-level npm install.</text>

  <!-- submission -->
  <rect x="600" y="740" width="430" height="108" rx="12" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <text class="box-title" x="628" y="781">Submit under Providers</text>
  <text class="box-text" x="628" y="812">npm:paseo-dsh-direct@0.2.26</text>
  <text class="box-text" x="628" y="838">after owner approval</text>
  <path d="M1320 680 L1320 710 L815 710 L815 740" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- verification -->
  <rect x="80" y="740" width="430" height="190" rx="12" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
  <text class="ok" x="108" y="780">Verified on this candidate</text>
  <text class="box-text" x="108" y="816">Clean local copy and clean Git clone</text>
  <text class="box-text" x="108" y="848">loaded as running, no build.</text>
  <text class="box-text" x="108" y="880">Tarball, typechecks and 351 tests.</text>
  <text class="small" x="108" y="914">Not yet: npm 0.2.26 release and review</text>

  <rect x="1120" y="740" width="400" height="190" rx="12" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
  <text class="warn" x="1148" y="780">Waiting for the owner</text>
  <text class="box-text" x="1148" y="816">Approve merge and release,</text>
  <text class="box-text" x="1148" y="848">then submit 0.2.26.</text>
  <text class="box-text" x="1148" y="880">Current install unchanged.</text>

  <text class="small" x="80" y="970">Blue outline: changed in this candidate. Green: verified. Amber: not yet verified or awaiting approval.</text>
</svg>
