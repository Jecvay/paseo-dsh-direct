<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">在 Paseo 查看 DSH 子代理：候选实现与验收状态</title>
<desc id="desc">父会话原本只显示通用工具卡。候选按原生父子会话关系拆分子代理时间线，校验恢复归属并等待明确并发关联。本地检查和真实 DSH 桥接验证通过，宿主与设备验收状态见 PR，总结对应候选尚未发布。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#38556d"/></marker></defs>
