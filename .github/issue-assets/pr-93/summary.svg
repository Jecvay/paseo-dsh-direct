<g font-size="28" text-anchor="middle"><text x="260" y="515">识别原生父子关系</text><text x="260" y="560">过滤 fork 继承历史</text><text x="260" y="605">恢复前核对会话头</text><text x="800" y="515">独立投影子会话</text><text x="800" y="560">同名并发等明确 ID</text><text x="800" y="605">不因提前结束强行配对</text><text x="1340" y="515">原生子代理轨道</text><text x="1340" y="560">详情面板与启动卡</text><text x="1340" y="605">旧宿主保留父卡片</text></g>
